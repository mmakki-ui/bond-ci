name: s3-sweep

# Throwaway diagnostic: is S3's peerloss a consistent gap or seed-marginal?
# Runs SIM_ONLY=S3 across a spread of PYTHONHASHSEED and prints peerloss + verdict.
on:
  # RETARGETED BY scripts/sync-public-ci.sh. The SOURCE is workflow_dispatch-only so the
  # PRIVATE repo (paid Actions minutes) starts nothing; the mirror is public and free, and
  # carries ONE BRANCH PER UNIT under test, so it fires on all of them. A unit whose branch
  # triggered no run reads as NO EVIDENCE, which is the state that made five units
  # unverifiable at once.
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build daemon
        working-directory: p4-bondagg/daemon
        run: CGO_ENABLED=0 go build -o /tmp/bond-agg .
      - name: S3 robustness — 12 runs at fixed seed (isolate daemon-timing variance)
        working-directory: p4-bondagg/sim
        run: |
          set +e
          pass=0
          for i in $(seq 1 12); do
            out=$(PYTHONHASHSEED=0 SIM_ONLY=S3 python pathsim.py 2>/dev/null)
            ml=$(echo "$out" | grep -oE "median_peerloss=[0-9.]+%" | head -1)
            v=$(echo "$out"  | grep -oE "(PASS|FAIL) S3" | head -1)
            echo "run $i: $ml  $v"
            echo "$v" | grep -q PASS && pass=$((pass+1))
          done
          echo "=== S3: $pass/12 PASS at PYTHONHASHSEED=0 ==="
          true
