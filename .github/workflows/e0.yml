name: e0
# The E0 skeleton battery, the same command `bash scripts/ci-local.sh e0` runs.
# U258: this arm had no workflow, so every unit with a bar in p5/test/run.sh could only be
# gated on one local box, one at a time.
#
# On the mirror the RB family SKIPS: sync-public-ci.sh publishes docs/deploy-p5-server.md and
# not docs/deploy-p5-runbook.md, and run.sh's RB_PRESENT guard turns the client-runbook bars
# into skipbar lines rather than failures. That is the mirror's shape, not a weakened gate --
# a full checkout still measures them.
on:
  # RETARGETED BY scripts/sync-public-ci.sh. The SOURCE is workflow_dispatch-only so the
  # PRIVATE repo (paid Actions minutes) starts nothing; the mirror is public and free, and
  # carries ONE BRANCH PER UNIT under test, so it fires on all of them. A unit whose branch
  # triggered no run reads as NO EVIDENCE, which is the state that made five units
  # unverifiable at once.
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  e0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: e0 skeleton battery
        run: |
          sh p5/test/run.sh > /tmp/e0.log 2>&1; rc=$?
          tail -40 /tmp/e0.log
          echo "--- lines naming a failure ---"
          grep -nE '^FAIL' /tmp/e0.log | head -20 || true
          exit $rc
      - name: log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e0-log
          path: /tmp/e0.log
